name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/leemage_ci
      IRON_SESSION_COOKIE_NAME: leemage_ci
      IRON_SESSION_PASSWORD: ci-only-password-with-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ROOT_USER_EMAIL: ci@example.com
      ROOT_USER_PASSWORD_HASH_B64: JDJiJDEyJGNpLm9ubHkuaGFzaC5ub3QuZm9yLnVzZQ==

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check generated artifacts
        run: git diff --exit-code

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
